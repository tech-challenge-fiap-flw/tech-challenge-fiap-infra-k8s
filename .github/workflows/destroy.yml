name: Destroy Infra K8s

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente (prod, staging, dev)'
        required: true
        default: 'staging'

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "TF_WORKSPACE_NAME=production" >> $GITHUB_ENV
            echo "TF_VAR_environment=production" >> $GITHUB_ENV
          else
            echo "TF_WORKSPACE_NAME=staging" >> $GITHUB_ENV
            echo "TF_VAR_environment=staging" >> $GITHUB_ENV
          fi

      - name: Select or Create Workspace
        run: |
          terraform workspace select "$TF_WORKSPACE_NAME" || terraform workspace new "$TF_WORKSPACE_NAME"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var="environment=${{ github.event.inputs.environment }}"
