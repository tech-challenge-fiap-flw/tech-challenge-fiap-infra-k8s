name: 'Terraform Deploy'

on:
  push:
    branches:
      - main
      - staging

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Set Environment Variables
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "TF_WORKSPACE_NAME=production" >> $GITHUB_ENV
          echo "TF_VAR_environment=production" >> $GITHUB_ENV
        else
          echo "TF_WORKSPACE_NAME=staging" >> $GITHUB_ENV
          echo "TF_VAR_environment=staging" >> $GITHUB_ENV
        fi

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Validate
      run: terraform validate

    - name: Select or Create Workspace
      run: |
        terraform workspace select "$TF_WORKSPACE_NAME" || terraform workspace new "$TF_WORKSPACE_NAME"

    - name: Terraform Plan
      run: terraform plan -no-color

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      run: terraform apply -auto-approve